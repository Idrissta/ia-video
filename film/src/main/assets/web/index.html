<script>
/* Remplissage des curseurs : expose la position (--p) pour la piste en dégradé. */
(function () {
  var sel = 'input[type=range]';
  function fill(el) {
    var min = parseFloat(el.min), max = parseFloat(el.max), v = parseFloat(el.value);
    if (isNaN(min)) min = 0;
    if (isNaN(max)) max = 100;
    var p = max > min ? (v - min) / (max - min) * 100 : 0;
    el.style.setProperty('--p', Math.max(0, Math.min(100, p)).toFixed(2) + '%');
  }
  function scan(root) {
    if (!root || root.nodeType !== 1) return;
    if (root.matches(sel)) fill(root);
    var list = root.querySelectorAll(sel);
    for (var i = 0; i < list.length; i++) fill(list[i]);
  }
  document.addEventListener('input', function (e) {
    if (e.target && e.target.matches && e.target.matches(sel)) fill(e.target);
  }, true);
  document.addEventListener('change', function (e) {
    if (e.target && e.target.matches && e.target.matches(sel)) fill(e.target);
  }, true);
  new MutationObserver(function (recs) {
    for (var i = 0; i < recs.length; i++) {
      var added = recs[i].addedNodes;
      for (var j = 0; j < added.length; j++) scan(added[j]);
    }
  }).observe(document.body, { childList: true, subtree: true });
})();
</script>
