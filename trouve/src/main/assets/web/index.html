<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0b14">
  <title>Trouve ton IA</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <main id="view" class="view" aria-live="polite"></main>

  <div class="tray" id="tray" hidden>
    <div class="tray-logos" id="tray-logos"></div>
    <button class="tray-go" type="button" id="tray-go">Comparer</button>
    <button class="tray-x" type="button" id="tray-x" aria-label="Vider la comparaison">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Navigation">
    <button type="button" class="tab" data-tab="accueil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 4l8.5 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-6v6H5A1.5 1.5 0 0 1 3.5 19z"/></svg>
      <span>Accueil</span>
    </button>
    <button type="button" class="tab" data-tab="explorer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
      <span>Explorer</span>
    </button>
    <button type="button" class="tab tab-creer" data-tab="creer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l1.9 4.6 4.6 1.9-4.6 1.9L12 16.5l-1.9-4.6L5.5 10l4.6-1.9z"/><path d="M18.5 15.5l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8z"/></svg>
      <span>Créer</span>
    </button>
    <button type="button" class="tab" data-tab="favoris">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg>
      <span>Favoris</span>
    </button>
    <button type="button" class="tab" data-tab="reglages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
      <span>Réglages</span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="js/search.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/natif.js"></script>
<script src="js/montage.js"></script>
<script src="js/generateurs.js"></script>
<script src="js/studio.js"></script>
</body>
</html>
