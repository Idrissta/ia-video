name: Sonde des générateurs gratuits

# Vérifie depuis la CI (accès à Internet) quels générateurs gratuits le studio de
# Trouve ton IA peut utiliser, et enregistre le résultat sur la même branche.
on:
  push:
    branches: ["**"]
    paths:
      - "tools/trouve-recherche/sonder.js"
      - ".github/workflows/trouve-sonde.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trouve-sonde-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonder:
    name: Sonder les générateurs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sonder
        run: node tools/trouve-recherche/sonder.js

      - name: Enregistrer les résultats sur la branche
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/trouve-recherche/sondes.json || exit 0
          git commit -m "Sonde des générateurs gratuits : résultats [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
