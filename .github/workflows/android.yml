name: APK Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler l'APK
    runs-on: ubuntu-latest
    env:
      # Secrets facultatifs pour signer avec votre propre clé (voir README).
      KEYSTORE_B64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
      NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
      NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
      NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
      NOVA_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests du moteur mathématique
        run: node tools/test-math.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature personnelle
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "NOVA_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Compiler l'APK de production
        run: ./gradlew --no-daemon assembleRelease

      - name: Vérifier la signature et le manifeste
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|launchable-activity)"

      - name: Préparer le fichier
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/NovaGraph-1.0.${{ github.run_number }}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: NovaGraph-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publier une version (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
